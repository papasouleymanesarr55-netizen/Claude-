name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de production (sans données de démonstration)
        run: npm run build
      - name: Aucune donnée de démonstration dans le build de production
        run: '! grep -rl "__DEMO_DATASET__" dist'
      - name: Le build de production refuse VITE_DEMO_DATA=true
        run: |
          if VITE_DEMO_DATA=true npx vite build --outDir /tmp/should-fail; then
            echo "Le garde-fou n'a pas bloqué le build" && exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
